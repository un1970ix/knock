[package]
name = "knock"
version = "2026.0.1"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"
description = "An email reveal API protected by proof of work."
repository = "https://github.com/un1970ix/knock"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.23.1"
hmac = "=0.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
url = "=2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
